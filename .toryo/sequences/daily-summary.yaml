name: schwankie-daily-summary
version: 1
description: Cluster the last 24h of schwankie links into ranked topics and publish them.
entry: fetch
input:
  lookbackHours: {type: number, default: 24}
  topicCount: {type: number, default: 10}
steps:
  fetch:
    kind: worker
    description: Pull the noise-filtered source window from the API to the run dir.
    prompt: |
      Read apps/tasks/.env for API_URL and API_KEY.

      GET {API_URL}/api/digest/source-items?hours={{run.lookbackHours}} with an
      `Authorization: Bearer {API_KEY}` header, and write the response body
      verbatim to {{runDir}}/source.json. Do not summarize, edit, or reformat it.

      The response is a JSON object with items, windowStart, windowEnd and
      count. An empty items array is a valid result — write it anyway.
    payload:
      # A worker step must declare llm — dispatch rejects a payload without it,
      # and the daemon seeds no default unless TORYO_SEQUENCE_WORKER_DEFAULTS is set.
      llm: {model: default}
      agent: {orientation: implementer}
      timeoutMs: 600000
      successCheck: {kind: fileExists, paths: ["{{runDir}}/source.json"]}
    on: {success: load}
  load:
    kind: transform
    description: Parse the window into the step graph — a completion turn has no tools.
    use: read-json
    file: source.json
    output:
      items: {type: array, items: object}
      windowStart: string
      windowEnd: string
      count: number
    on: {default: rank}
  rank:
    kind: completion
    description: Cluster the window into ranked topics as validated JSON.
    prompt: |
      These are the {{steps.load.output.count}} links schwankie collected
      between {{steps.load.output.windowStart}} and {{steps.load.output.windowEnd}}:

      <items>
      {{steps.load.output.items}}
      </items>

      Cluster them into at most {{run.topicCount}} topics, ranked by
      significance — the topic that matters most to a working engineer first.

      Each topic needs:
        - rank: its position, starting at 1
        - title: a short noun phrase, not a headline
        - body: exactly two sentences saying what happened and why it matters
        - itemCount: how many links the topic covers
        - links: the representative links, each {url, title, source} copied
          verbatim from the items above

      Also write `notable`: one sentence on the single most significant thing
      in the window.

      If the item list is empty, return an empty topics array and a notable
      line saying the window was quiet.
    output:
      topics: {type: array, items: object}
      notable: string
    payload:
      # Required even on a completion step: the compiler supplies llm and
      # outputSchema itself, but not agent, and dispatch rejects a payload
      # without one.
      agent: {orientation: planner}
    on: {success: publish}
  publish:
    kind: worker
    description: POST the already-schema-checked payload to the API.
    prompt: |
      Read apps/tasks/.env for API_URL and API_KEY.

      The ranked topics, already schema-validated, are this JSON array:
      <topics>
      {{steps.rank.output.topics}}
      </topics>

      The notable line is, verbatim between the markers:
      <notable>
      {{steps.rank.output.notable}}
      </notable>

      The source window these were clustered from, to record verbatim:
        windowStart = {{steps.load.output.windowStart}}
        windowEnd   = {{steps.load.output.windowEnd}}
        itemCount   = {{steps.load.output.count}}

      Write a request body to {{runDir}}/payload.json of the form
      {"topics": <the array above>, "notable": <the notable text, JSON-encoded>,
       "windowStart": <windowStart>, "windowEnd": <windowEnd>,
       "itemCount": <itemCount as a number>}
      using a script — do NOT hand-assemble the JSON, the notable text may
      contain quotes or newlines.

      itemCount is the size of the SOURCE WINDOW above, not the number of
      links in the topics — the API derives that itself. Do not recompute it.

      Then POST that file to {API_URL}/api/digest/daily-summary with an
      `Authorization: Bearer {API_KEY}` header and Content-Type
      application/json. The endpoint upserts on summary_date, so re-running
      this overwrites today rather than duplicating it.

      Report the response status. A 201 is success; anything else is a failure.
    payload:
      llm: {model: default}
      agent: {orientation: implementer}
      timeoutMs: 300000
    on: {success: null}

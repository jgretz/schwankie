name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - release

jobs:
  bun-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - run: bun run check:bun-version
